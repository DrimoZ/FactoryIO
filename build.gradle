plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = "${mc_version}-${mod_version}"
group = "com.drimoz.${mod_id}"

base {
    archivesName = "${mod_id}"
}

// Mojang ships Java 17 to end users in 1.18+, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // Parchment = mappings officielles Mojang + noms de paramètres. C'est la
    // configuration de référence pour Forge 1.20.1, et celle contre laquelle les
    // bibliothèques à mixins (GeckoLib) sont réellement testées.
    mappings channel: 'parchment', version: parchment_version

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Les bibliothèques à mixins (GeckoLib) embarquent un refmap en noms SRG.
            // En workspace de développement les classes portent les noms mappés, il faut
            // donc demander à Mixin de traduire le refmap au chargement — sans quoi les
            // @Inject ne trouvent aucune cible et le jeu plante au démarrage.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Lance GameTestServer, exécute tous les gametests enregistrés, puis quitte.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            property 'forge.enabledGameTestNamespaces', mod_id

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    maven {
        // JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // GSON n'est pas déclaré ici : Minecraft le fournit déjà sur le classpath.

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${mc_version}:${geckolib_version}")

    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")

    // Mods tiers utilisés uniquement pour les tests manuels d'interopérabilité.
    // Désactivés par défaut : ils ralentissent runClient et peuvent entrer en conflit.
    //   ./gradlew runClient -PwithTestMods
    if (project.hasProperty('withTestMods')) {
        runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "${mod_id}",
                "Specification-Vendor"    : "DrimoZ",
                "Specification-Version"   : "${mod_version}",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "DrimoZ",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Les structures de GameTest sont lues depuis un dossier du répertoire de jeu
// (StructureTemplateManager.TEST_STRUCTURES_DIR = "gameteststructures"), et non depuis
// un datapack. On les garde donc versionnées dans src/gametest/structures et on les
// recopie avant chaque exécution — run/ étant ignoré par git.
tasks.register('copyGameTestStructures', Copy) {
    from 'src/gametest/structures'
    into file('run/gameteststructures')
}

tasks.matching { it.name in ['runGameTestServer', 'runClient', 'runServer'] }.configureEach {
    dependsOn 'copyGameTestStructures'
}
