[[mods]] #mandatory
modId="factor_io" #mandatory
version="${file.jarVersion}" #mandatory
displayName="Factor'I/O" #mandatory
displayURL="https://github.com/DrimoZ/FactoryIO" #optional
authors="DrimoZ" #optional
description='''
Factor'I/O brings Factorio's automation mechanics to Minecraft.

Inserters move items between inventories on their own: burner, electric, long handed,
fast, stack, and filtering variants. Each one is defined by data rather than by code,
so additional inserters can be added by dropping a JSON file into
config/factor_io/inserters/.

Transport belts carry items on two lanes, curve, and hand off between blocks.
Inserters drop onto the far lane, as in Factorio. Belts expose an inventory on every
face, so hoppers and pipes from other mods can load and unload them.

Crafters, Factorio's assembling machines, come in three tiers: pick a recipe, feed them
with inserters, and they make the plates, gears and circuits of the next machine.
Modules speed them up, make them productive or save power.

Beta: the crafter and ramp models are placeholders.
'''

[[dependencies.factor_io]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="[47,)" #mandatory
    ordering="NONE"
    side="BOTH"

